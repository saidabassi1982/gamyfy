<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="gamyfy-companion-version" content="1.4-team-links">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Guess the Heroes - Phone Buzzer</title>
    <style>
      :root{--gold:#f6c85f;--violet:#a78bfa;--paper:#f4f0e9;--muted:#9da4b4;--panel:#111522}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0,#243451 0,transparent 42%),#090b11;color:var(--paper);font:16px system-ui}main{width:min(460px,100%);text-align:center}h1{margin:0 0 6px;letter-spacing:.08em}#status{min-height:48px;color:#d9deea;line-height:1.45}input,button{width:100%;border:0;border-radius:12px;padding:16px;font:inherit;margin:8px 0}input{background:#1b2130;color:#fff}button{font-weight:900;color:#20190b;background:var(--gold)}fieldset{margin:14px 0;border:1px solid #30384c;border-radius:14px;padding:10px}legend{padding:0 8px;color:var(--muted);font-size:12px;font-weight:800}.team-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.team-option{display:block;padding:14px 8px;border:2px solid transparent;border-radius:11px;background:#171c29;font-weight:850;cursor:pointer}.team-option input{position:absolute;opacity:0;width:1px}.team-option:has(input:checked){border-color:var(--gold);background:#292315}.team-option.violet:has(input:checked){border-color:var(--violet);background:#201a34}.team-badge{display:block;width:fit-content;margin:0 auto 12px;padding:7px 12px;border:1px solid var(--gold);border-radius:999px;color:var(--gold);font-size:12px;font-weight:900;letter-spacing:.08em}.team-badge.b{border-color:var(--violet);color:var(--violet)}.buzz{display:block;margin:0 auto;border-radius:50%;width:min(230px,72vw);height:min(230px,72vw);font-size:30px;background:var(--gold);box-shadow:0 0 0 14px #f6c85f22;transition:.2s transform,.2s filter}.buzz.team-b{background:var(--violet);box-shadow:0 0 0 14px #a78bfa22}.buzz:active{transform:scale(.94)}.buzz:disabled{opacity:.5}.buzz.accepted{animation:buzzWin .65s ease-in-out infinite}.result{margin:14px 0;padding:18px;border:2px solid #30384c;border-radius:14px;font-size:20px;font-weight:900}.result.correct{border-color:#62d69a;background:#10251d;color:#8ef0ba}.result.wrong{border-color:#ff7272;background:#2b1117;color:#ff9a9a}@keyframes buzzWin{50%{transform:scale(1.06);filter:brightness(1.2)}}small{display:block;margin-top:12px;color:var(--muted);line-height:1.4}.buzz.live{animation:buzzLive 1.5s ease-in-out infinite}@keyframes buzzLive{50%{box-shadow:0 0 0 26px #f6c85f10}}.buzz.hit{animation:buzzHit .18s ease-out}@keyframes buzzHit{50%{transform:scale(.9);filter:brightness(1.4)}}.locked-team{display:grid;gap:4px;margin:14px 0;padding:14px;border:2px solid var(--gold);border-radius:14px;background:#171c29}.locked-team.b{border-color:var(--violet)}.locked-team span{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.12em}.locked-team strong{font-size:19px;color:var(--gold)}.locked-team.b strong{color:var(--violet)}
    </style>
  </head>
  <body>
    <main>
      <h1>LIVE BUZZER</h1>
      <p id="status">Enter your name and choose your team.</p>
      <section id="join">
        <input id="name" autocomplete="name" placeholder="Your name">
        <div class="locked-team" id="lockedTeam" hidden><span>YOUR TEAM</span><strong id="lockedTeamName"></strong></div>
        <fieldset id="teamPicker"><legend>Choose your team</legend><div class="team-options"><label class="team-option"><input type="radio" name="team" value="a" checked><span id="teamAName">Team Gold</span></label><label class="team-option violet"><input type="radio" name="team" value="b"><span id="teamBName">Team Violet</span></label></div></fieldset>
        <button id="joinBtn">Join buzzer room</button>
      </section>
      <section id="play" hidden>
        <span class="team-badge" id="teamBadge">TEAM GOLD</span>
        <button class="buzz" id="buzz" disabled>WAITING</button>
        <div id="answer" hidden><input id="answerInput" autocomplete="off" placeholder="Hero or actor name"><button id="send">Send typed answer</button></div>
        <div class="result" id="result" hidden></div>
        <small id="rule">The host will open buzzing when the picture appears. You may also shout your answer.</small>
      </section>
    </main>
    <script src="assets/vendor/peerjs.min.js"></script>
    <script>
      const query = new URLSearchParams(location.search), room = query.get('room'), $ = (selector) => document.querySelector(selector);
      let peer, conn, audio, team = 'a', teamNames = { a: 'Team Gold', b: 'Team Violet' }, lastResult = '';
      function tone(frequency, duration, type = 'sine') { try { audio ||= new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); const oscillator = audio.createOscillator(), gain = audio.createGain(); oscillator.frequency.value = frequency; oscillator.type = type; gain.gain.setValueAtTime(.09, audio.currentTime); gain.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + duration); oscillator.connect(gain).connect(audio.destination); oscillator.start(); oscillator.stop(audio.currentTime + duration); } catch {} }
      function setMode(mode) { const mastermind = mode === 'mastermind'; $('#answerInput').placeholder = mastermind ? 'Character name only' : 'Hero or actor name'; $('#rule').textContent = mastermind ? 'Character names only. You may type or shout your answer.' : 'Hero or actor accepted. You may type or shout your answer.'; }
      function applyTeamNames(names = teamNames) { teamNames = { ...teamNames, ...names }; $('#teamAName').textContent = teamNames.a; $('#teamBName').textContent = teamNames.b; $('#teamBadge').textContent = teamNames[team].toUpperCase(); $('#teamBadge').className = `team-badge ${team}`; $('#buzz').className = `buzz team-${team}`; }

      // A team-specific QR carries its team, that team's name and its colour.
      const lockedTeam = ['a', 'b'].includes(query.get('team')) ? query.get('team') : null;
      if (lockedTeam) {
        team = lockedTeam;
        const givenName = (query.get('name') || '').trim();
        if (givenName) teamNames[team] = givenName.slice(0, 28);
        const givenColor = query.get('color');
        if (givenColor && /^#[0-9a-fA-F]{3,8}$/.test(givenColor)) {
          document.documentElement.style.setProperty(team === 'a' ? '--gold' : '--violet', givenColor);
        }
        document.querySelector(`input[name="team"][value="${team}"]`).checked = true;
        $('#teamPicker').hidden = true;
        const badge = $('#lockedTeam');
        badge.hidden = false;
        badge.className = `locked-team ${team}`;
        $('#lockedTeamName').textContent = teamNames[team];
        $('#joinBtn').textContent = `Join as ${teamNames[team]}`;
        $('#status').textContent = `You are joining ${teamNames[team]}. Enter your name to start.`;
      }
      function showResult(kind, text) { lastResult = kind; $('#result').hidden = false; $('#result').className = `result ${kind}`; $('#result').textContent = text; }
      function resetQuestion() { lastResult = ''; $('#result').hidden = true; $('#answer').hidden = true; $('#answerInput').value = ''; $('#send').disabled = false; $('#buzz').classList.remove('accepted'); }
      /* Phone-buzzer relay. Without TURN a phone can only reach the host over a
     direct connection, which guest Wi-Fi and mobile data routinely block -
     leaving the phone stuck on "Connecting". TURN credentials only; the
     Metered secret key must never ship in a download. */
  const BUZZER_STUN = [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' },
    { urls: 'stun:stun.cloudflare.com:3478' },
    { urls: 'stun:stun.relay.metered.ca:80' }
  ];
  // PeerJS ships these relays and uses them unless you replace its config.
  // Keep them: they cost nothing and may work on networks where a direct
  // connection does not. Add your own provider's entries alongside them.
  // Gamyfy relay account (Metered, app "gamyfy"). These are TURN credentials
  // only - NOT the Metered secret key, which must never ship in a download.
  // Verified working: relay candidates confirmed on a relay-only ICE test.
  // If the monthly quota is ever exhausted, create a new credential at
  // dashboard.metered.ca -> Developers, then replace the two values below.
  const BUZZER_TURN = [
    { urls: 'turn:global.relay.metered.ca:80',
      username: 'ba88079176616565ef57f408', credential: '2sorAbF4hI8eMjGO' },
    { urls: 'turn:global.relay.metered.ca:80?transport=tcp',
      username: 'ba88079176616565ef57f408', credential: '2sorAbF4hI8eMjGO' },
    { urls: 'turn:global.relay.metered.ca:443',
      username: 'ba88079176616565ef57f408', credential: '2sorAbF4hI8eMjGO' },
    { urls: 'turns:global.relay.metered.ca:443?transport=tcp',
      username: 'ba88079176616565ef57f408', credential: '2sorAbF4hI8eMjGO' },
    // kept as a last-resort fallback
    { urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'],
      username: 'peerjs', credential: 'peerjsp' }
  ];

  const BUZZER_RTC = { iceServers: BUZZER_STUN.concat(BUZZER_TURN) };
      function handleHostMessage(message) {
            if (!message || typeof message !== 'object') return;
            if (message.teamNames) applyTeamNames(message.teamNames); if (message.mode) setMode(message.mode);
            if (message.type === 'joined') { team = message.team || team; savePlayer(); applyTeamNames(message.teamNames); if (message.playStyle === 'host') { resetQuestion(); $('#buzz').disabled = true; $('#buzz').textContent = 'HOST MODE'; $('#status').textContent = 'Host / Shout Mode is selected. Shout answers to the host.'; } }
            if (message.type === 'question-live') { resetQuestion(); $('#buzz').disabled = false; $('#buzz').textContent = 'BUZZ!'; $('#buzz').classList.add('live'); $('#status').textContent = message.mode === 'mastermind' ? 'Character-only question - buzz or shout!' : 'Hero or actor accepted - buzz or shout!'; }
            if (message.type === 'buzz-accepted') { $('#answer').hidden = false; $('#buzz').classList.remove('live'); $('#answerInput').value = ''; $('#send').disabled = false; $('#buzz').disabled = true; $('#buzz').textContent = 'YOU BUZZED!'; $('#buzz').classList.add('accepted'); $('#status').textContent = 'You buzzed first - type your answer or shout it now.'; tone(760, .12); setTimeout(() => tone(980, .18), 100); navigator.vibrate?.([80,45,150]); $('#answerInput').focus(); }
            if (message.type === 'state') { const locked = message.lockedTeams?.includes(team) || message.locked?.includes(peer.id); if (message.playStyle === 'host') { $('#buzz').disabled = true; $('#buzz').textContent = 'HOST MODE'; $('#status').textContent = 'Shout your answer to the host.'; return; } $('#buzz').disabled = locked || !!message.active; $('#buzz').classList.toggle('live', !locked && !message.active); $('#buzz').textContent = locked ? 'TEAM LOCKED' : message.active === peer.id ? 'YOU BUZZED!' : message.active ? 'OTHER TEAM BUZZED' : 'BUZZ!'; if (locked) { $('#answer').hidden = true; if (lastResult !== 'wrong') showResult('wrong', `${teamNames[team]} is locked out`); $('#status').textContent = `${teamNames[team]} is locked out. ${teamNames[team === 'a' ? 'b' : 'a']} may buzz or shout.`; } else if (!message.active && !lastResult) { $('#answer').hidden = true; const rival = team === 'a' ? 'b' : 'a'; $('#status').textContent = message.lockedTeams?.includes(rival) ? `${teamNames[rival]} missed - this one is yours. Buzz!` : 'Buzzing is open.'; } }
            if (message.type === 'answer-result') { $('#answer').hidden = true; $('#buzz').classList.remove('accepted'); if (message.correct) { showResult('correct', `CORRECT! +${message.points || 1}`); $('#status').textContent = message.judgedByHost ? `Host awarded the point to ${message.teamName || teamNames[team]}.` : `${message.teamName || teamNames[team]} scored automatically.`; tone(880,.12); setTimeout(()=>tone(1100,.2),110); navigator.vibrate?.([70,40,70,40,180]); } else { showResult('wrong', 'WRONG - TEAM LOCKED'); $('#status').textContent = `${message.otherTeamName || teamNames[team === 'a' ? 'b' : 'a']} may now buzz or shout.`; tone(180,.22,'sawtooth'); navigator.vibrate?.([250]); } }
            if (message.type === 'question-closed') { if (message.reason === 'host-mode') { resetQuestion(); $('#buzz').disabled = true; $('#buzz').textContent = 'HOST MODE'; $('#status').textContent = 'Host / Shout Mode - answer aloud.'; return; } $('#answer').hidden = true; $('#buzz').disabled = true; $('#buzz').classList.remove('accepted'); $('#buzz').classList.remove('live'); if (!lastResult) { $('#buzz').textContent = 'WAITING'; $('#status').textContent = 'Question closed. Waiting for the next hero.'; } }
          }

      let playerName = '', retries = 0, retryTimer = null, wakeLock = null;
      const PLAYER_KEY = 'hero-buzzer-player';
      function savePlayer() {
        try { localStorage.setItem(PLAYER_KEY, JSON.stringify({ room, team, name: playerName })); } catch (err) {}
      }
      function loadPlayer() {
        // Tied to the room code, so a brand new game still asks who you are.
        try {
          const saved = JSON.parse(localStorage.getItem(PLAYER_KEY) || 'null');
          return saved && saved.room === room && saved.name ? saved : null;
        } catch (err) { return null; }
      }
      async function requestWakeLock() {
        if (!('wakeLock' in navigator) || wakeLock) return;
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        } catch (err) {}
      }
      function scheduleReconnect() {
        if (retryTimer) return;
        retries++;
        if (retries > 10) {
          $('#status').textContent = 'Could not reach the host - tap here to try again.';
          $('#status').style.cursor = 'pointer';
          $('#status').onclick = () => { retries = 0; $('#status').onclick = null; $('#status').style.cursor = ''; startConnect(); };
          return;
        }
        const delay = Math.min(1000 * Math.pow(1.5, retries - 1), 6000);
        retryTimer = setTimeout(() => { retryTimer = null; startConnect(); }, delay);
      }
      function reconnectIfNeeded() {
        if (document.hidden || !playerName) return;
        requestWakeLock();
        if (!conn || !conn.open) {
          retries = 0;
          clearTimeout(retryTimer);
          retryTimer = null;
          startConnect();
        }
      }
      function startConnect() {
        clearTimeout(retryTimer); retryTimer = null;
        const oldPeer = peer; peer = null; conn = null;
        try { oldPeer?.destroy(); } catch (err) {}
        const currentPeer = peer = new Peer({ debug: 0, config: BUZZER_RTC });
        peer.on('open', () => {
          if (peer !== currentPeer) return;
          const currentConn = conn = currentPeer.connect(`hero-${room}`, { reliable: true });
          conn.on('open', () => {
            if (peer !== currentPeer || conn !== currentConn) return;
            clearTimeout(retryTimer); retryTimer = null;
            retries = 0;
            conn.send({ type: 'join', name: playerName, team, teamLocked: Boolean(lockedTeam) });
            savePlayer();
            $('#join').hidden = true; $('#play').hidden = false;
            $('#status').style.cursor = ''; $('#status').onclick = null;
            $('#status').textContent = `Connected to ${teamNames[team]}. Waiting for the host.`;
          });
          conn.on('data', message => { if (peer === currentPeer && conn === currentConn) handleHostMessage(message); });
          conn.on('close', () => {
            if (peer !== currentPeer || conn !== currentConn) return;
            $('#buzz').disabled = true;
            $('#buzz').classList.remove('live');
            $('#buzz').textContent = 'RECONNECTING';
            $('#status').textContent = 'Lost the host - reconnecting...';
            scheduleReconnect();
          });
          conn.on('error', () => { if (peer === currentPeer) scheduleReconnect(); });
        });
        peer.on('disconnected', () => {
          if (peer !== currentPeer) return;
          try { peer.reconnect(); } catch (err) { scheduleReconnect(); }
        });
        peer.on('error', (err) => {
          if (peer !== currentPeer) return;
          const type = err?.type || 'unknown';
          $('#buzz').disabled = true;
          $('#status').textContent = 'Connection problem (' + type + ') - retrying...';
          if (['peer-unavailable', 'server-error', 'socket-error', 'socket-closed', 'network', 'network-error'].includes(type)) scheduleReconnect();
        });
      }
      $('#joinBtn').onclick = () => {
        const name = $('#name').value.trim();
        team = lockedTeam || document.querySelector('input[name="team"]:checked').value;
        if (!name || !room) { $('#status').textContent = 'Enter your name and open a valid room link.'; return; }
        playerName = name;
        applyTeamNames();
        requestWakeLock();
        startConnect();
      };

      // Reload, or leave the page and come back, and the phone lets itself back in.
      const savedPlayer = loadPlayer();
      if (savedPlayer) {
        playerName = savedPlayer.name;
        if (!lockedTeam && ['a', 'b'].includes(savedPlayer.team)) {
          team = savedPlayer.team;
          const radio = document.querySelector(`input[name="team"][value="${team}"]`);
          if (radio) radio.checked = true;
        }
        applyTeamNames();
        $('#join').hidden = true;
        $('#play').hidden = false;
        $('#buzz').disabled = true;
        $('#buzz').textContent = 'RECONNECTING';
        $('#status').textContent = `Rejoining ${teamNames[team]} as ${playerName}...`;
        requestWakeLock();
        startConnect();
      }

      // A silent signal loss does not fire conn.on('close'), so the phone can sit there
      // looking connected. conn.open does flip within a few seconds, so poll for it.
      setInterval(() => {
        if (!playerName || conn?.open) return;
        if ($('#buzz').textContent !== 'RECONNECTING') {
          $('#buzz').disabled = true;
          $('#buzz').classList.remove('live');
          $('#buzz').textContent = 'RECONNECTING';
          $('#status').textContent = 'Lost the host - reconnecting...';
        }
        scheduleReconnect();
      }, 3000);
      document.addEventListener('visibilitychange', reconnectIfNeeded);
      window.addEventListener('online', reconnectIfNeeded);
      window.addEventListener('pageshow', reconnectIfNeeded);
      document.addEventListener('pointerdown', requestWakeLock);
      $('#buzz').onclick = () => { if (!conn?.open) return; tone(300,.06); navigator.vibrate?.(25); $('#buzz').classList.add('hit'); setTimeout(() => $('#buzz').classList.remove('hit'), 200); conn.send({ type:'buzz' }); };
      function sendAnswer() { const answer = $('#answerInput').value.trim(); if (!answer || !conn?.open) return; $('#send').disabled = true; conn.send({ type:'answer', answer }); $('#status').textContent = 'Answer sent - judging automatically...'; }
      $('#send').onclick = sendAnswer; $('#answerInput').addEventListener('keydown', (event) => { if (event.key === 'Enter') sendAnswer(); });
    </script>
  </body>
</html>
